name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pipx install poetry
      - run: poetry install
      - run: poetry run pytest tests/ --cov=classdock --cov-report=term-missing

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pipx install poetry
      - run: poetry install
      - run: poetry run flake8 classdock/ --select=E9,F63,F7,F82 --count --show-source --statistics
      - run: poetry run black --check classdock/
      - run: poetry run isort --check-only classdock/
